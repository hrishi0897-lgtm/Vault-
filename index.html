<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quikr Vault - Telegram Unlimited Cloud Storage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0f19',
                        cardBg: '#131c2e',
                        cardBorder: '#1e293b',
                        accentCyan: '#06b6d4',
                        accentEmerald: '#10b981',
                        accentBlue: '#3b82f6'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b0f19; color: #f8fafc; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0b0f19; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
        .glass-panel { background: rgba(19, 28, 46, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased">
    <header class="sticky top-0 z-50 glass-panel border-b border-cardBorder px-4 lg:px-8 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-emerald-400 flex items-center justify-center shadow-lg shadow-cyan-500/20">
                <i class="fa-solid fa-vault text-darkBg text-lg font-bold"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg tracking-tight">Quikr <span class="text-cyan-400">Vault</span></h1>
                <p class="text-xs text-slate-400">Telegram Unlimited Cloud Storage</p>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <button id="uploadModalBtn" class="bg-gradient-to-r from-emerald-500 to-teal-600 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow-lg">Upload</button>
            <button id="settingsModalBtn" class="w-10 h-10 rounded-xl bg-cardBorder flex items-center justify-center text-slate-300"><i class="fa-solid fa-gear"></i></button>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 lg:px-8 py-6 space-y-6">
        <div id="filesContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
    </main>

    <!-- Upload Modal -->
    <div id="uploadModal" class="fixed inset-0 z-50 hidden bg-darkBg/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="glass-panel w-full max-w-lg rounded-2xl p-6 space-y-4">
            <h3 class="text-lg font-bold">Upload File</h3>
            <input type="file" id="fileInput" class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-cyan-500 file:text-darkBg">
            <div class="flex justify-end space-x-2">
                <button id="closeUploadBtn" class="px-4 py-2 bg-cardBorder rounded-xl text-sm">Cancel</button>
                <button id="startUploadBtn" class="px-4 py-2 bg-cyan-500 text-darkBg rounded-xl text-sm font-semibold">Start Upload</button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 z-50 hidden bg-darkBg/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="glass-panel w-full max-w-md rounded-2xl p-6 space-y-4">
            <h3 class="text-lg font-bold">Telegram Settings</h3>
            <input type="password" id="botTokenInput" placeholder="Bot Token" class="w-full bg-cardBg border border-cardBorder rounded-xl px-4 py-2 text-sm text-slate-200">
            <input type="text" id="chatIdInput" placeholder="Chat ID" class="w-full bg-cardBg border border-cardBorder rounded-xl px-4 py-2 text-sm text-slate-200">
            <div class="flex justify-end space-x-2">
                <button id="closeSettingsBtn" class="px-4 py-2 bg-cardBorder rounded-xl text-sm">Cancel</button>
                <button id="saveSettingsBtn" class="px-4 py-2 bg-emerald-500 text-white rounded-xl text-sm font-semibold">Save Settings</button>
            </div>
        </div>
    </div>

    <script>
        const backendUrl = "https://vault-pmt4.onrender.com";
        let vaultFiles = JSON.parse(localStorage.getItem('vault_files')) || [];

        // DOM Elements Event Listeners (Fixes mobile touch/click issues)
        document.getElementById('settingsModalBtn').addEventListener('click', () => {
            document.getElementById('botTokenInput').value = localStorage.getItem('botToken') || '';
            document.getElementById('chatIdInput').value = localStorage.getItem('chatId') || '';
            document.getElementById('settingsModal').classList.remove('hidden');
        });

        document.getElementById('closeSettingsBtn').addEventListener('click', () => {
            document.getElementById('settingsModal').classList.add('hidden');
        });

        document.getElementById('saveSettingsBtn').addEventListener('click', () => {
            const token = document.getElementById('botTokenInput').value.trim();
            const chatId = document.getElementById('chatIdInput').value.trim();
            if(!token || !chatId) {
                alert('Please enter both Bot Token and Chat ID');
                return;
            }
            localStorage.setItem('botToken', token);
            localStorage.setItem('chatId', chatId);
            document.getElementById('settingsModal').classList.add('hidden');
            alert('Settings saved successfully!');
        });

        document.getElementById('uploadModalBtn').addEventListener('click', () => {
            document.getElementById('uploadModal').classList.remove('hidden');
        });

        document.getElementById('closeUploadBtn').addEventListener('click', () => {
            document.getElementById('uploadModal').classList.add('hidden');
        });

        document.getElementById('startUploadBtn').addEventListener('click', async () => {
            const fileInput = document.getElementById('fileInput');
            if (fileInput.files.length === 0) return alert('Select a file first!');
            
            const botToken = localStorage.getItem('botToken');
            const chatId = localStorage.getItem('chatId');
            if (!botToken || !chatId) return alert('Please configure your bot token and chat ID in settings first!');

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            formData.append('botToken', botToken);
            formData.append('chatId', chatId);

            alert('Uploading and chunking file to Telegram via backend...');
            try {
                const res = await fetch(`${backendUrl}/api/upload`, { method: 'POST', body: formData });
                const data = await res.json();
                if(data.success) {
                    vaultFiles.unshift(data);
                    localStorage.setItem('vault_files', JSON.stringify(vaultFiles));
                    document.getElementById('uploadModal').classList.add('hidden');
                    renderFiles();
                    alert('File uploaded successfully!');
                } else {
                    alert('Upload failed: ' + (data.error || 'Unknown error'));
                }
            } catch (err) {
                alert('Error connecting to backend server.');
            }
        });

        function renderFiles() {
            const container = document.getElementById('filesContainer');
            if(vaultFiles.length === 0) {
                container.innerHTML = '<p class="text-xs text-slate-500 col-span-full text-center py-8">No files uploaded yet.</p>';
                return;
            }
            container.innerHTML = vaultFiles.map((file, index) => `
                <div class="glass-panel p-4 rounded-xl space-y-3">
                    <p class="text-sm font-semibold truncate">${file.fileName}</p>
                    <p class="text-xs text-slate-400">Parts: ${file.parts}</p>
                    <button onclick="downloadFile(${index})" class="w-full py-2 bg-cyan-500/20 text-cyan-400 rounded-lg text-xs font-semibold">Reassemble & Download</button>
                </div>
            `).join('');
        }

        async function downloadFile(index) {
            const file = vaultFiles[index];
            const botToken = localStorage.getItem('botToken');
            alert('Reassembling chunks from Telegram server...');
            
            try {
                const res = await fetch(`${backendUrl}/api/download`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ botToken, telegramMessages: file.telegramMessages, fileName: file.fileName })
                });
                const blob = await res.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = file.fileName;
                a.click();
            } catch(e) {
                alert('Download failed');
            }
        }
        renderFiles();
    </script>
</body>
</html>
