
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quikr Vault - Telegram Unlimited Cloud Storage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0f19',
                        cardBg: '#131c2e',
                        cardBorder: '#1e293b',
                        accentCyan: '#06b6d4',
                        accentEmerald: '#10b981',
                        accentBlue: '#3b82f6'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b0f19; color: #f8fafc; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #0b0f19; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
        .glass-panel { background: rgba(19, 28, 46, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 15px rgba(6, 182, 212, 0.15); }
            50% { box-shadow: 0 0 25px rgba(6, 182, 212, 0.35); }
        }
        .engine-active { animation: pulseGlow 3s infinite; }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

    <!-- Header -->
    <header class="sticky top-0 z-50 glass-panel border-b border-cardBorder px-4 lg:px-8 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-emerald-400 flex items-center justify-center shadow-lg shadow-cyan-500/20">
                <i class="fa-solid fa-vault text-darkBg text-lg font-bold"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg tracking-tight flex items-center gap-1.5">Quikr <span class="text-cyan-400">Vault</span></h1>
                <p class="text-[11px] text-slate-400">Telegram Unlimited Cloud Storage</p>
            </div>
        </div>
        <div class="flex items-center space-x-2.5">
            <button id="uploadModalBtn" class="bg-gradient-to-r from-emerald-500 to-teal-600 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow-lg">Upload</button>
            <button id="settingsModalBtn" class="w-10 h-10 rounded-xl bg-cardBorder flex items-center justify-center text-slate-300"><i class="fa-solid fa-gear"></i></button>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 lg:px-8 py-6 space-y-6">
        <!-- Overview -->
        <section class="glass-panel rounded-2xl p-6 relative overflow-hidden engine-active">
            <div class="text-xs font-semibold tracking-wider text-slate-400 uppercase mb-4">Storage Overview</div>
            <div class="flex flex-col md:flex-row items-center justify-between gap-6">
                <div class="relative w-44 h-44 flex items-center justify-center flex-shrink-0">
                    <svg class="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="42" stroke="#1e293b" stroke-width="8" fill="none"></circle>
                        <circle id="storageProgressCircle" cx="50" cy="50" r="42" stroke="url(#cyanGradient)" stroke-width="8" stroke-dasharray="264" stroke-dashoffset="200" stroke-linecap="round" fill="none" class="transition-all duration-700"></circle>
                        <defs>
                            <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#06b6d4" />
                                <stop offset="100%" stop-color="#3b82f6" />
                            </linearGradient>
                        </defs>
                    </svg>
                    <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
                        <span class="text-[10px] font-medium text-slate-400 uppercase tracking-wider">Used Space</span>
                        <span id="totalUsedSpaceText" class="text-2xl font-bold text-slate-100 mt-0.5">0 B</span>
                        <span class="text-xs text-cyan-400 font-medium mt-0.5">of ∞ Capacity</span>
                    </div>
                </div>
                <div class="flex-1 grid grid-cols-2 gap-3.5 w-full max-w-md">
                    <div class="bg-cardBorder/30 p-3.5 rounded-xl border border-cardBorder/50"><p class="text-[11px] text-slate-400">Photos</p><p id="sizePhotos" class="text-xs font-bold text-slate-200">0 B</p></div>
                    <div class="bg-cardBorder/30 p-3.5 rounded-xl border border-cardBorder/50"><p class="text-[11px] text-slate-400">Videos</p><p id="sizeVideos" class="text-xs font-bold text-slate-200">0 B</p></div>
                    <div class="bg-cardBorder/30 p-3.5 rounded-xl border border-cardBorder/50"><p class="text-[11px] text-slate-400">Docs</p><p id="sizeDocs" class="text-xs font-bold text-slate-200">0 B</p></div>
                    <div class="bg-cardBorder/30 p-3.5 rounded-xl border border-cardBorder/50"><p class="text-[11px] text-slate-400">Other</p><p id="sizeOther" class="text-xs font-bold text-slate-200">0 B</p></div>
                </div>
            </div>
        </section>

        <!-- Files Section -->
        <section class="space-y-4">
            <div class="flex justify-between items-center"><span id="currentBreadcrumb" class="text-slate-200 font-semibold text-base">Root Vault</span></div>
            <div id="filesContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
        </section>
    </main>

    <!-- Upload Modal -->
    <div id="uploadModal" class="fixed inset-0 z-50 hidden bg-darkBg/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="glass-panel w-full max-w-lg rounded-2xl p-6 space-y-4">
            <h3 class="text-base font-bold text-slate-100">Upload to Telegram Vault</h3>
            <input type="file" id="fileInput" class="w-full text-xs text-slate-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:bg-cyan-500 file:text-darkBg file:font-semibold">
            
            <div id="progressContainer" class="hidden space-y-2 pt-2">
                <div class="flex justify-between text-xs text-slate-400">
                    <span id="progressStatusText">Preparing upload...</span>
                    <span id="progressPercentText">0%</span>
                </div>
                <div class="w-full bg-cardBorder rounded-full h-2 overflow-hidden">
                    <div id="progressBar" class="bg-cyan-500 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>

            <div class="flex justify-end space-x-2 pt-2">
                <button id="closeUploadBtn" class="px-4 py-2 bg-cardBorder rounded-xl text-xs">Cancel</button>
                <button id="startUploadBtn" class="px-4 py-2 bg-cyan-500 text-darkBg rounded-xl text-xs font-semibold">Start Upload</button>
            </div>
        </div>
    </div>

    <!-- Download Chunks Modal -->
    <div id="downloadModal" class="fixed inset-0 z-50 hidden bg-darkBg/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="glass-panel w-full max-w-lg rounded-2xl p-6 space-y-4">
            <div class="flex justify-between items-center"><h3 class="text-base font-bold">Download File Chunks</h3><button id="closeDownloadBtn" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button></div>
            <div id="chunksListContainer" class="space-y-2 max-h-48 overflow-y-auto"></div>
            <button id="reassembleBtn" class="w-full py-2.5 bg-gradient-to-r from-cyan-500 to-blue-600 text-darkBg font-bold rounded-xl text-xs">Reassemble & Download Single File</button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 z-50 hidden bg-darkBg/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="glass-panel w-full max-w-md rounded-2xl p-6 space-y-4">
            <h3 class="text-base font-bold">Telegram Bot Settings</h3>
            <input type="password" id="botTokenInput" placeholder="Bot Token" class="w-full bg-cardBg border border-cardBorder rounded-xl px-3 py-2 text-xs text-slate-200">
            <input type="text" id="chatIdInput" placeholder="Chat ID" class="w-full bg-cardBg border border-cardBorder rounded-xl px-3 py-2 text-xs text-slate-200">
            <div class="flex justify-end space-x-2">
                <button id="closeSettingsBtn" class="px-4 py-2 bg-cardBorder rounded-xl text-xs">Cancel</button>
                <button id="saveSettingsBtn" class="px-4 py-2 bg-emerald-500 text-white rounded-xl text-xs font-semibold">Save</button>
            </div>
        </div>
    </div>

    <script>
        const backendUrl = "https://vault-pmt4.onrender.com";
        let vaultState = {
            currentFolderId: 'root',
            files: JSON.parse(localStorage.getItem('quikr_files')) || []
        };
        let activeFileForChunks = null;

        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024, sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function loadVaultData() {
            let totalBytes = 0, photos = 0, videos = 0, docs = 0, others = 0;
            vaultState.files.forEach(f => {
                totalBytes += f.size;
                if (f.type === 'photos') photos += f.size;
                else if (f.type === 'videos') videos += f.size;
                else if (f.type === 'docs') docs += f.size;
                else others += f.size;
            });

            document.getElementById('totalUsedSpaceText').textContent = formatBytes(totalBytes);
            document.getElementById('sizePhotos').textContent = formatBytes(photos);
            document.getElementById('sizeVideos').textContent = formatBytes(videos);
            document.getElementById('sizeDocs').textContent = formatBytes(docs);
            document.getElementById('sizeOther').textContent = formatBytes(others);

            const circumference = 264;
            const progress = Math.min(totalBytes / (1024 * 1024 * 1024 * 10), 1);
            document.getElementById('storageProgressCircle').style.strokeDashoffset = circumference - (progress * circumference);

            const container = document.getElementById('filesContainer');
            if(vaultState.files.length === 0) {
                container.innerHTML = '<p class="col-span-full text-center text-xs text-slate-500 py-12">No files in vault yet.</p>';
                return;
            }

            container.innerHTML = vaultState.files.map((file, idx) => `
                <div class="glass-panel p-4 rounded-2xl border border-cardBorder space-y-3">
                    <p class="text-xs font-semibold truncate">${file.fileName}</p>
                    <p class="text-[10px] text-slate-400">${formatBytes(file.size)} • ${file.parts} Parts</p>
                    <button onclick="openDownloadModal(${idx})" class="w-full py-2 bg-cyan-500/20 text-cyan-400 rounded-xl text-xs font-semibold">Download Links</button>
                </div>
            `).join('');
        }

        document.getElementById('settingsModalBtn').addEventListener('click', () => {
            document.getElementById('botTokenInput').value = localStorage.getItem('botToken') || '';
            document.getElementById('chatIdInput').value = localStorage.getItem('chatId') || '';
            document.getElementById('settingsModal').classList.remove('hidden');
        });
        document.getElementById('closeSettingsBtn').addEventListener('click', () => document.getElementById('settingsModal').classList.add('hidden'));
        document.getElementById('saveSettingsBtn').addEventListener('click', () => {
            localStorage.setItem('botToken', document.getElementById('botTokenInput').value.trim());
            localStorage.setItem('chatId', document.getElementById('chatIdInput').value.trim());
            document.getElementById('settingsModal').classList.add('hidden');
            alert('Settings saved!');
        });

        document.getElementById('uploadModalBtn').addEventListener('click', () => {
            document.getElementById('uploadModal').classList.remove('hidden');
            document.getElementById('progressContainer').classList.add('hidden');
            document.getElementById('fileInput').value = '';
        });
        document.getElementById('closeUploadBtn').addEventListener('click', () => document.getElementById('uploadModal').classList.add('hidden'));

        // Client-side 5MB fast chunking upload handler
        document.getElementById('startUploadBtn').addEventListener('click', async () => {
            const fileInput = document.getElementById('fileInput');
            if(fileInput.files.length === 0) return alert('Select file first.');
            const token = localStorage.getItem('botToken');
            const chatId = localStorage.getItem('chatId');
            if(!token || !chatId) return alert('Configure Telegram settings first!');

            const file = fileInput.files[0];
            let cat = 'others';
            if (file.type.startsWith('image/')) cat = 'photos';
            else if (file.type.startsWith('video/')) cat = 'videos';
            else if (file.type.includes('pdf')) cat = 'docs';

            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');
            const progressPercentText = document.getElementById('progressPercentText');
            const progressStatusText = document.getElementById('progressStatusText');
            
            progressContainer.classList.remove('hidden');

            const CHUNK_SIZE = 5 * 1024 * 1024; // 5MB fast chunking
            const totalParts = Math.ceil(file.size / CHUNK_SIZE);
            let telegramMessages = [];

            for (let i = 0; i < totalParts; i++) {
                const start = i * CHUNK_SIZE;
                const end = Math.min(start + CHUNK_SIZE, file.size);
                const chunk = file.slice(start, end);

                const percent = Math.round((i / totalParts) * 100);
                progressBar.style.width = percent + '%';
                progressPercentText.textContent = percent + '%';
                progressStatusText.textContent = `Uploading part ${i + 1} of ${totalParts}...`;

                const formData = new FormData();
                formData.append('file', chunk, `${file.name}.part${i + 1}_of_${totalParts}`);
                formData.append('botToken', token);
                formData.append('chatId', chatId);

                try {
                    const res = await fetch(`${backendUrl}/api/upload`, { method: 'POST', body: formData });
                    const data = await res.json();
                    if(data.success) {
                        telegramMessages.push({ fileId: data.fileId });
                    } else {
                        throw new Error(data.error);
                    }
                } catch(err) {
                    alert('Upload failed on part ' + (i + 1) + ': ' + err.message);
                    progressContainer.classList.add('hidden');
                    return;
                }
            }

            progressBar.style.width = '100%';
            progressPercentText.textContent = '100%';
            progressStatusText.textContent = 'Complete!';

            vaultState.files.unshift({
                fileName: file.name,
                size: file.size,
                parts: totalParts,
                telegramMessages,
                type: cat,
                date: new Date().toISOString()
            });
            localStorage.setItem('quikr_files', JSON.stringify(vaultState.files));

            setTimeout(() => {
                document.getElementById('uploadModal').classList.add('hidden');
                loadVaultData();
                alert('File uploaded successfully to Telegram Vault!');
            }, 300);
        });

        function openDownloadModal(index) {
            activeFileForChunks = vaultState.files[index];
            document.getElementById('chunksListContainer').innerHTML = activeFileForChunks.telegramMessages.map((m, i) => `
                <div class="p-2 bg-cardBg rounded-lg text-xs text-slate-300">Part ${i + 1} of ${activeFileForChunks.parts} ready</div>
            `).join('');
            document.getElementById('downloadModal').classList.add('flex');
            document.getElementById('downloadModal').classList.remove('hidden');
        }
        document.getElementById('closeDownloadBtn').addEventListener('click', () => document.getElementById('downloadModal').classList.add('hidden'));

        document.getElementById('reassembleBtn').addEventListener('click', async () => {
            if(!activeFileForChunks) return;
            alert('Reassembling file from Telegram...');
            try {
                const res = await fetch(`${backendUrl}/api/download`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ botToken: localStorage.getItem('botToken'), telegramMessages: activeFileForChunks.telegramMessages, fileName: activeFileForChunks.fileName })
                });
                const blob = await res.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = activeFileForChunks.fileName;
                a.click();
                document.getElementById('downloadModal').classList.add('hidden');
            } catch(e) {
                alert('Download failed');
            }
        });

        loadVaultData();
    </script>
</body>
</html>
